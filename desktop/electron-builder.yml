appId: com.valija.desktop
productName: Valija
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/node_modules/better-sqlite3-multiple-ciphers/**"
  - "**/node_modules/argon2/**"
  - "**/node_modules/@napi-rs/keyring/**"
npmRebuild: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  identity: null
  # Pinned rather than left to electron-builder's default (which omits the
  # arch suffix for a single-arch build and would collide between arm64/x64
  # otherwise) — docs/gui.md's checksum table names these exact files.
  artifactName: ${productName}-${version}-${arch}.dmg
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
  artifactName: ${productName}-${version}-Setup.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}
