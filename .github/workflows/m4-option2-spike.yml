name: "M4 Option 2 spike (temporary, one-off) — cross-compile SQLite3MultipleCiphers for mobile"

# advances/M4/spike.md: Tiers B/C' closed "official SQLCipher + legacy=N" as a path (still
# fails against the official package, matching two known unresolved upstream issues). The
# remaining untested option (D-G's Option 2) is building the LITERAL SQLite3MultipleCiphers
# amalgamation -- the exact file node-gyp compiles into the desktop native addon
# (node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3/sqlite3.c) -- for mobile
# toolchains, so both ends run the same implementation instead of two independently-compatible
# ones. This workflow cross-compiles that literal source for Android (NDK, arm64, executed
# under qemu-user) and iOS (arm64 simulator target, executed natively on the arm64 macOS
# runner) and opens valija's real golden-vault fixture (legacy=0, the actual production
# config) with each build. Not part of the normal CI pipeline -- this workflow and
# advances/M4/option2-spike/ are deleted once the result is recorded (D-L).
#
# Push-triggered (not workflow_dispatch) and path-scoped for the same reason as the earlier
# Tier C' spike: workflow_dispatch only registers once a workflow exists on the default
# branch, and this is deliberately never landing on main.

on:
  push:
    branches: [docs/vault-format-M4]
    paths:
      - ".github/workflows/m4-option2-spike.yml"
      - "advances/M4/option2-spike/**"

jobs:
  android-ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (populates node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3)
        run: npm ci
      - name: Locate NDK and qemu-user
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep aarch64 || true
          sudo apt-get update -y && sudo apt-get install -y qemu-user-static
      - name: Cross-compile the literal amalgamation for Android arm64
        run: |
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          SRC=node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3
          "$CLANG" -O1 -static \
            -DHAVE_INT16_T=1 -DHAVE_INT32_T=1 -DHAVE_INT8_T=1 -DHAVE_STDINT_H=1 \
            -DHAVE_UINT16_T=1 -DHAVE_UINT32_T=1 -DHAVE_UINT8_T=1 -DHAVE_USLEEP=1 \
            -DSQLITE_DEFAULT_CACHE_SIZE=-16000 -DSQLITE_DEFAULT_FOREIGN_KEYS=1 \
            -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_DQS=0 \
            -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_DESERIALIZE \
            -DSQLITE_ENABLE_FTS3 -DSQLITE_ENABLE_FTS3_PARENTHESIS -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_GEOPOLY -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -DSQLITE_ENABLE_PERCENTILE -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_STAT4 \
            -DSQLITE_ENABLE_UPDATE_DELETE_LIMIT -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_OMIT_DEPRECATED \
            -DSQLITE_OMIT_PROGRESS_CALLBACK -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_TCL_VARIABLE \
            -DSQLITE_SOUNDEX -DSQLITE_THREADSAFE=2 -DSQLITE_TRACE_SIZE_LIMIT=32 \
            -DSQLITE_USER_AUTHENTICATION=0 -DSQLITE_USE_URI=0 \
            -I"$SRC" -o test_android advances/M4/option2-spike/main.c "$SRC/sqlite3.c"
          file test_android
      - name: Run under qemu-user against the real golden-vault fixture
        run: |
          cp src/testing/__fixtures__/golden-vault/vault.db /tmp/android-vault.db
          qemu-aarch64-static ./test_android /tmp/android-vault.db

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (populates node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3)
        run: npm ci
      - name: Cross-compile and run natively on the arm64 runner
        run: |
          SRC=node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          clang -O1 -target arm64-apple-ios15.0-simulator -isysroot "$SDK" \
            -DHAVE_INT16_T=1 -DHAVE_INT32_T=1 -DHAVE_INT8_T=1 -DHAVE_STDINT_H=1 \
            -DHAVE_UINT16_T=1 -DHAVE_UINT32_T=1 -DHAVE_UINT8_T=1 -DHAVE_USLEEP=1 \
            -DSQLITE_DEFAULT_CACHE_SIZE=-16000 -DSQLITE_DEFAULT_FOREIGN_KEYS=1 \
            -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_DQS=0 \
            -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_DESERIALIZE \
            -DSQLITE_ENABLE_FTS3 -DSQLITE_ENABLE_FTS3_PARENTHESIS -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_GEOPOLY -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -DSQLITE_ENABLE_PERCENTILE -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_STAT4 \
            -DSQLITE_ENABLE_UPDATE_DELETE_LIMIT -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_OMIT_DEPRECATED \
            -DSQLITE_OMIT_PROGRESS_CALLBACK -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_TCL_VARIABLE \
            -DSQLITE_SOUNDEX -DSQLITE_THREADSAFE=2 -DSQLITE_TRACE_SIZE_LIMIT=32 \
            -DSQLITE_USER_AUTHENTICATION=0 -DSQLITE_USE_URI=0 \
            -I"$SRC" -o test_ios advances/M4/option2-spike/main.c "$SRC/sqlite3.c"
          file test_ios
          cp src/testing/__fixtures__/golden-vault/vault.db /tmp/ios-vault.db
          ./test_ios /tmp/ios-vault.db
      - name: Also confirm it compiles (link-only) for the real iOS device target
        run: |
          SRC=node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -O1 -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -DHAVE_INT16_T=1 -DHAVE_INT32_T=1 -DHAVE_INT8_T=1 -DHAVE_STDINT_H=1 \
            -DHAVE_UINT16_T=1 -DHAVE_UINT32_T=1 -DHAVE_UINT8_T=1 -DHAVE_USLEEP=1 \
            -DSQLITE_DEFAULT_CACHE_SIZE=-16000 -DSQLITE_DEFAULT_FOREIGN_KEYS=1 \
            -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_DQS=0 \
            -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_DESERIALIZE \
            -DSQLITE_ENABLE_FTS3 -DSQLITE_ENABLE_FTS3_PARENTHESIS -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_GEOPOLY -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -DSQLITE_ENABLE_PERCENTILE -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_STAT4 \
            -DSQLITE_ENABLE_UPDATE_DELETE_LIMIT -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_OMIT_DEPRECATED \
            -DSQLITE_OMIT_PROGRESS_CALLBACK -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_TCL_VARIABLE \
            -DSQLITE_SOUNDEX -DSQLITE_THREADSAFE=2 -DSQLITE_TRACE_SIZE_LIMIT=32 \
            -DSQLITE_USER_AUTHENTICATION=0 -DSQLITE_USE_URI=0 \
            -I"$SRC" -o test_ios_device advances/M4/option2-spike/main.c "$SRC/sqlite3.c"
          file test_ios_device
          echo "Device-target build linked successfully (cannot execute non-simulator arm64 binaries on macOS host)."
