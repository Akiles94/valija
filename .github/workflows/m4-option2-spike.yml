name: "M4 Option 2 spike (temporary, one-off) — cross-compile SQLite3MultipleCiphers for mobile"

# advances/M4/spike.md: Tiers B/C' closed "official SQLCipher + legacy=N" as a path (still
# fails against the official package, matching two known unresolved upstream issues). The
# remaining untested option (D-G's Option 2) is building the LITERAL SQLite3MultipleCiphers
# amalgamation -- the exact file node-gyp compiles into the desktop native addon
# (node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3/sqlite3.c) -- for mobile
# toolchains, so both ends run the same implementation instead of two independently-compatible
# ones. This workflow cross-compiles that literal source for Android (NDK, arm64, executed
# under qemu-user) and iOS (arm64 simulator target, executed natively on the arm64 macOS
# runner) and opens valija's real golden-vault fixture (legacy=0, the actual production
# config) with each build. Not part of the normal CI pipeline -- this workflow and
# advances/M4/option2-spike/ are deleted once the result is recorded (D-L).
#
# Push-triggered (not workflow_dispatch) and path-scoped for the same reason as the earlier
# Tier C' spike: workflow_dispatch only registers once a workflow exists on the default
# branch, and this is deliberately never landing on main.

on:
  push:
    branches: [docs/vault-format-M4]
    paths:
      - ".github/workflows/m4-option2-spike.yml"
      - "advances/M4/option2-spike/**"

jobs:
  android-ndk:
    # Compile-only evidence for the real device architecture: does the literal amalgamation
    # build clean against the NDK's bionic toolchain for arm64, the architecture real Android
    # phones run? bare qemu-user cannot actually execute the result (tried both static --
    # "TLS segment is underaligned ... needs to be at least 64 for ARM64 Bionic", a qemu/Bionic
    # ELF quirk -- and dynamic -- needs /system/bin/linker64, which only exists on a real
    # Android system image, not the NDK alone). Real execution evidence comes from the
    # android-emulator job below instead, which boots an actual system image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (populates node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3)
        run: npm ci
      - name: Cross-compile the literal amalgamation for Android arm64 (the real device architecture)
        run: |
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          SRC=node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3
          "$CLANG" -O1 \
            -DHAVE_INT16_T=1 -DHAVE_INT32_T=1 -DHAVE_INT8_T=1 -DHAVE_STDINT_H=1 \
            -DHAVE_UINT16_T=1 -DHAVE_UINT32_T=1 -DHAVE_UINT8_T=1 -DHAVE_USLEEP=1 \
            -DSQLITE_DEFAULT_CACHE_SIZE=-16000 -DSQLITE_DEFAULT_FOREIGN_KEYS=1 \
            -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_DQS=0 \
            -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_DESERIALIZE \
            -DSQLITE_ENABLE_FTS3 -DSQLITE_ENABLE_FTS3_PARENTHESIS -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_GEOPOLY -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -DSQLITE_ENABLE_PERCENTILE -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_STAT4 \
            -DSQLITE_ENABLE_UPDATE_DELETE_LIMIT -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_OMIT_DEPRECATED \
            -DSQLITE_OMIT_PROGRESS_CALLBACK -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_TCL_VARIABLE \
            -DSQLITE_SOUNDEX -DSQLITE_THREADSAFE=2 -DSQLITE_TRACE_SIZE_LIMIT=32 \
            -DSQLITE_USER_AUTHENTICATION=0 -DSQLITE_USE_URI=0 \
            -I"$SRC" -o test_android advances/M4/option2-spike/main.c "$SRC/sqlite3.c" -lm -ldl
          file test_android

  android-emulator:
    # Real execution evidence: boots an actual Android system image (x86_64 -- runs natively
    # under KVM on the GH-hosted runner, no ARM translation overhead, and just as valid a
    # Bionic/Android-userspace test as arm64 since the cipher logic is portable, architecture-
    # independent C -- arm64 portability is already covered by android-ndk's real-device-arch
    # compile above) and executes the binary via adb, exactly like a real device would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (populates node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3)
        run: npm ci
      - name: Enable KVM group perms (required for hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cross-compile the literal amalgamation for Android x86_64 (matches the emulator image)
        run: |
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          SRC=node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3
          "$CLANG" -O1 \
            -DHAVE_INT16_T=1 -DHAVE_INT32_T=1 -DHAVE_INT8_T=1 -DHAVE_STDINT_H=1 \
            -DHAVE_UINT16_T=1 -DHAVE_UINT32_T=1 -DHAVE_UINT8_T=1 -DHAVE_USLEEP=1 \
            -DSQLITE_DEFAULT_CACHE_SIZE=-16000 -DSQLITE_DEFAULT_FOREIGN_KEYS=1 \
            -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_DQS=0 \
            -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_DESERIALIZE \
            -DSQLITE_ENABLE_FTS3 -DSQLITE_ENABLE_FTS3_PARENTHESIS -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_GEOPOLY -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -DSQLITE_ENABLE_PERCENTILE -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_STAT4 \
            -DSQLITE_ENABLE_UPDATE_DELETE_LIMIT -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_OMIT_DEPRECATED \
            -DSQLITE_OMIT_PROGRESS_CALLBACK -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_TCL_VARIABLE \
            -DSQLITE_SOUNDEX -DSQLITE_THREADSAFE=2 -DSQLITE_TRACE_SIZE_LIMIT=32 \
            -DSQLITE_USER_AUTHENTICATION=0 -DSQLITE_USE_URI=0 \
            -I"$SRC" -o test_android_emu advances/M4/option2-spike/main.c "$SRC/sqlite3.c" -lm -ldl
          file test_android_emu
      - name: Run inside a real Android emulator via adb
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb push test_android_emu /data/local/tmp/test_android_emu
            adb push src/testing/__fixtures__/golden-vault/vault.db /data/local/tmp/vault.db
            adb shell chmod 755 /data/local/tmp/test_android_emu
            adb shell /data/local/tmp/test_android_emu /data/local/tmp/vault.db

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (populates node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3)
        run: npm ci
      - name: Cross-compile and run natively on the arm64 runner (Apple clang/toolchain, macOS target)
        run: |
          # A literal arm64-apple-ios-simulator Mach-O binary needs full CoreSimulator
          # infrastructure to execute (dyld_sim, not just DYLD_ROOT_PATH) -- a rabbit hole
          # unrelated to the actual question. The original Tier C' spike sidestepped this
          # by testing as a plain macOS target (its Package.swift declared macOS, not iOS) --
          # matching that proven approach here. The separate device-target step below still
          # confirms the source compiles for the real iOS arm64 target via Apple's toolchain.
          SRC=node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          clang -O1 -target arm64-apple-macos13.0 -isysroot "$SDK" \
            -DHAVE_INT16_T=1 -DHAVE_INT32_T=1 -DHAVE_INT8_T=1 -DHAVE_STDINT_H=1 \
            -DHAVE_UINT16_T=1 -DHAVE_UINT32_T=1 -DHAVE_UINT8_T=1 -DHAVE_USLEEP=1 \
            -DSQLITE_DEFAULT_CACHE_SIZE=-16000 -DSQLITE_DEFAULT_FOREIGN_KEYS=1 \
            -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_DQS=0 \
            -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_DESERIALIZE \
            -DSQLITE_ENABLE_FTS3 -DSQLITE_ENABLE_FTS3_PARENTHESIS -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_GEOPOLY -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -DSQLITE_ENABLE_PERCENTILE -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_STAT4 \
            -DSQLITE_ENABLE_UPDATE_DELETE_LIMIT -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_OMIT_DEPRECATED \
            -DSQLITE_OMIT_PROGRESS_CALLBACK -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_TCL_VARIABLE \
            -DSQLITE_SOUNDEX -DSQLITE_THREADSAFE=2 -DSQLITE_TRACE_SIZE_LIMIT=32 \
            -DSQLITE_USER_AUTHENTICATION=0 -DSQLITE_USE_URI=0 \
            -I"$SRC" -o test_ios advances/M4/option2-spike/main.c "$SRC/sqlite3.c"
          file test_ios
          cp src/testing/__fixtures__/golden-vault/vault.db /tmp/ios-vault.db
          ./test_ios /tmp/ios-vault.db
      - name: Also confirm it compiles (link-only) for the real iOS device target
        if: always()
        run: |
          SRC=node_modules/better-sqlite3-multiple-ciphers/deps/sqlite3
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -O1 -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -DHAVE_INT16_T=1 -DHAVE_INT32_T=1 -DHAVE_INT8_T=1 -DHAVE_STDINT_H=1 \
            -DHAVE_UINT16_T=1 -DHAVE_UINT32_T=1 -DHAVE_UINT8_T=1 -DHAVE_USLEEP=1 \
            -DSQLITE_DEFAULT_CACHE_SIZE=-16000 -DSQLITE_DEFAULT_FOREIGN_KEYS=1 \
            -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_DQS=0 \
            -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_DESERIALIZE \
            -DSQLITE_ENABLE_FTS3 -DSQLITE_ENABLE_FTS3_PARENTHESIS -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_GEOPOLY -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -DSQLITE_ENABLE_PERCENTILE -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_STAT4 \
            -DSQLITE_ENABLE_UPDATE_DELETE_LIMIT -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_OMIT_DEPRECATED \
            -DSQLITE_OMIT_PROGRESS_CALLBACK -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_TCL_VARIABLE \
            -DSQLITE_SOUNDEX -DSQLITE_THREADSAFE=2 -DSQLITE_TRACE_SIZE_LIMIT=32 \
            -DSQLITE_USER_AUTHENTICATION=0 -DSQLITE_USE_URI=0 \
            -I"$SRC" -o test_ios_device advances/M4/option2-spike/main.c "$SRC/sqlite3.c"
          file test_ios_device
          echo "Device-target build linked successfully (cannot execute non-simulator arm64 binaries on macOS host)."
